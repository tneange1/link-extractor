name: link-extractor

# Что запускать, задаёт COMPOSE_PROFILES в .env:
#   extractor      — экстрактор (на сервере с панелью)
#   bot            — Telegram-бот управления
#   extractor,bot  — оба на одном сервере
services:
  link-extractor:
    profiles: ["extractor"]
    build: .
    image: link-extractor:latest
    container_name: link-extractor
    hostname: link-extractor
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - remnawave-network

  bot:
    profiles: ["bot"]
    build: ./bot
    image: link-extractor-bot:latest
    container_name: link-extractor-bot
    hostname: link-extractor-bot
    restart: always
    env_file: .env
    volumes:
      - ./data/bot:/app/data
      # база экстрактора на этом же сервере — только чтение (бот берёт из неё токен своей панели)
      - ./data:/extractor-data:ro
    networks:
      - remnawave-network

  # Автообновление с GitHub + бэкапы БД панели (AUTO_UPDATE=false — выключить обновления)
  updater:
    image: docker:27-cli
    container_name: link-extractor-updater
    restart: always
    env_file: .env
    working_dir: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    entrypoint: ["sh", "-c", "apk add --no-cache git curl >/dev/null 2>&1; exec sh ./updater/loop.sh"]

networks:
  remnawave-network:
    name: remnawave-network
    external: true
